[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp3{9,10,11,12,13,14,14t}-*"
skip = "*-musllinux_*"
test-sources = ["sample"]
test-command = "python sample/sample.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
before-all = """
python "{package}/scripts/install-go-from-mod.py" \
    --go-mod "{package}/hysteria2-go/app/go.mod" \
    --install-dir /opt/hysteria2-go
"""
environment = { PATH="/opt/hysteria2-go/bin:$PATH" }

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET="12.0" }
