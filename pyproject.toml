[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
enable = ["cpython-freethreading"]
skip = ["*-musllinux_*"]
build = [
    "cp38-*",
    "cp39-*",
    "cp310-*",
    "cp311-*",
    "cp312-*",
    "cp313-*",
    "cp313t-*",
    "cp314-*",
    "cp314t-*",
]
test-sources = ["sample"]
test-command = "python sample/sample.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux2014"
before-all = [
    "mkdir -p /opt/hysteria2-go",
    "curl -fsSL https://go.dev/dl/go1.26.5.linux-amd64.tar.gz | tar -xz -C /opt/hysteria2-go --strip-components=1",
]
environment = { PATH="/opt/hysteria2-go/bin:$PATH" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET="12.0" }
