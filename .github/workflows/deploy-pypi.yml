name: Build and publish Python distributions

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact commit or tag to build instead of the triggering ref
        required: false
        type: string
      release_tag:
        description: Downstream vX.Y.Z[.N] tag to publish after successful builds
        required: false
        type: string
      upstream_tag:
        description: Exact upstream app/vX.Y.Z tag for release provenance
        required: false
        type: string
permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheels (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - os: windows-2022
            platform: windows
            arch: AMD64
          - os: windows-11-arm
            platform: windows
            arch: ARM64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.ref }}

      # Linux builds run in manylinux containers; Go is installed there by
      # tool.cibuildwheel.linux.before-all in pyproject.toml.
      - name: Set up Go
        if: matrix.platform != 'linux'
        uses: actions/setup-go@v7
        with:
          go-version-file: hysteria2-go/app/go.mod
          cache-dependency-path: |
            hysteria2-go/app/go.sum
            hysteria2-go/core/go.sum
            hysteria2-go/extras/go.sum

      - name: Set up MinGW-w64
        if: matrix.platform == 'windows' && matrix.arch == 'AMD64'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Set up LLVM-MinGW
        if: matrix.platform == 'windows' && matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260616-ucrt-aarch64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip'
          $expectedHash = '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM-MinGW checksum mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $toolchainBin = Get-ChildItem -Path $destination -Filter gcc.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $toolchainBin) {
            throw 'LLVM-MinGW gcc.exe was not found'
          }

          $target = (& (Join-Path $toolchainBin 'gcc.exe') -dumpmachine).Trim()
          if ($target -ne 'aarch64-w64-windows-gnu') {
            throw "LLVM-MinGW has the wrong target: $target"
          }

          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      # cibuildwheel 4 dropped CPython 3.8 and the experimental CPython 3.13t
      # builds. Keep this isolated pass until the project drops those wheels.
      - name: Build and test CPython 3.8 and 3.13t wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp3{8,13t}-*"
          CIBW_ENABLE: cpython-freethreading

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and validate source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*
      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  store:
    name: Store all distribution packages
    runs-on: ubuntu-24.04
    needs:
      - build-wheels
      - build-sdist
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  finalize-release:
    name: Finalize release tag
    if: >-
      ${{ !cancelled() && needs.store.result == 'success' &&
          (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    needs: store
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Validate new release target
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          if [[ -z "$UPSTREAM_TAG" ]]; then
            echo 'upstream_tag is required when release_tag is supplied' >&2
            exit 1
          fi
          python scripts/sync-hysteria.py guard-release \
            --release-tag "$RELEASE_TAG" --upstream-tag "$UPSTREAM_TAG"

      - name: Validate existing release tag
        if: inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          upstream_tag=$(cat UPSTREAM_VERSION)
          python scripts/sync-hysteria.py guard-release \
            --release-tag "$RELEASE_TAG" --upstream-tag "$upstream_tag" \
            --allow-existing-tag

      - name: Create release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Export release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          upstream_tag=${INPUT_UPSTREAM_TAG:-$(cat UPSTREAM_VERSION)}
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: ${{ !cancelled() && needs.finalize-release.result == 'success' }}
    needs:
      - store
      - finalize-release
    runs-on: ubuntu-latest
    environment:
      name: deploy-pypi
      url: https://pypi.org/p/hysteria2
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload to GitHub Release
    if: ${{ !cancelled() && needs.publish-to-pypi.result == 'success' }}
    needs:
      - publish-to-pypi
      - finalize-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Create release notes
        env:
          UPSTREAM_TAG: ${{ needs.finalize-release.outputs.upstream_tag }}
        run: >-
          python scripts/sync-hysteria.py release-notes
          --upstream-tag "$UPSTREAM_TAG" --output release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.finalize-release.outputs.release_tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo '${{ github.repository }}'
          --verify-tag
          --notes-file release-notes.md
      - name: Upload distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.finalize-release.outputs.release_tag }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/*
          --repo '${{ github.repository }}'
